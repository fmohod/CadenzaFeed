<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Cadenza Arthouse — Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="game-canvas"></canvas>
  <!-- Save reset lives inside the in-game terminal (SYSTEM screen), not on the HUD. -->

  <!-- Engine: Archive → Simulation → Presentation (+ Audio + Records + Terminal + Touch) -->
  <script src="engine/archive.js?v=12"></script>
  <script src="engine/simulation.js?v=12"></script>
  <script src="engine/audio.js?v=12"></script>
  <script src="engine/record.js?v=13"></script>
  <script src="engine/engine.js?v=12"></script>
  <script src="engine/presentation.js?v=12"></script>
  <script src="engine/terminal.js?v=15"></script>
  <script src="engine/touch.js?v=12"></script>

  <script>
    const canvas = document.getElementById('game-canvas');
    const presentation = new Presentation(canvas);
    const engine = new Engine();

    // On-screen controls for phones/tablets. Desktop is untouched unless ?touch.
    if (TouchControls.shouldEnable()) {
      window.touchControls = new TouchControls(engine);
    }

    engine.init(presentation).catch(e => {
      console.error('Engine init failed:', e.message, e.stack);
    });
  </script>

</body>
</html>
