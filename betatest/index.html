<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d0b08">
    <title>Cadenza Arthouse — World</title>
    <link rel="icon" href="data:,">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- CAIN's stylesheet first (it styles the in-world computer), the world's
         stylesheet last so the world wins for everything outside the overlay. -->
    <link rel="stylesheet" href="css/terminal.css?v=5">
    <link id="cain-interface-pack-css" rel="stylesheet" href="">
    <link rel="stylesheet" href="world/world.css?v=4">
</head>
<body class="world-shell">

    <!-- THE WORLD (V0: the Houston Sandbox). Everything here is data-driven from
         content/. See README.md in this folder for the architecture and the
         acceptance tests this build has to pass. -->
    <canvas id="world-canvas" aria-label="Cadenza Arthouse world"></canvas>

    <div id="hud" aria-live="polite">
        <div id="hud-space"></div>
        <div id="hud-weather"></div>
        <div id="hud-hint"></div>
    </div>

    <div id="dialogue" hidden>
        <div id="dialogue-speaker"></div>
        <div id="dialogue-text"></div>
        <div id="dialogue-more">▼</div>
    </div>

    <!-- Touch controls. Same six actions the keyboard produces; the engine never
         learns which one you used. -->
    <div id="touch" hidden>
        <div id="touch-dpad">
            <button class="tbtn" data-act="UP"    aria-label="Up">▲</button>
            <button class="tbtn" data-act="LEFT"  aria-label="Left">◀</button>
            <button class="tbtn" data-act="RIGHT" aria-label="Right">▶</button>
            <button class="tbtn" data-act="DOWN"  aria-label="Down">▼</button>
        </div>
        <div id="touch-actions">
            <button class="tbtn tbtn-b" data-act="BACK"     aria-label="Back">B</button>
            <button class="tbtn tbtn-a" data-act="INTERACT" aria-label="Interact">A</button>
        </div>
    </div>

    <div id="dev-badge" hidden>DEV</div>
    <div id="fatal" hidden></div>

    <!-- THE IN-WORLD COMPUTER: CAIN, mounted once, shown when the player sits at a
         terminal. Same files as terminal.html — one terminal, two doors. -->
    <div id="cain-overlay" hidden>
        <div class="crt-overlay"></div>
        <div class="scanlines"></div>
        <main id="cain-os-display"></main>
    </div>

    <!-- platform/ — shared libraries (Architecture v1.0) -->
    <script src="/platform/events/bus.js?v=16"></script>

    <!-- CAIN (unchanged services + screens; system.js carries the host seam) -->
    <script src="js/audio.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/config.js"></script>
    <script src="/game/engine/record.js?v=3"></script>
    <script src="js/services/archive.js?v=2"></script>
    <script src="js/services/interface-packs.js"></script>
    <script src="js/services/deployment.js"></script>
    <script src="js/focus.js"></script>
    <script src="js/system.js?v=3"></script>
    <script src="js/screens/boot.js?v=2"></script>
    <script src="js/screens/home.js?v=4"></script>
    <script src="js/screens/archive.js?v=2"></script>
    <script src="js/screens/record.js?v=3"></script>
    <script src="js/screens/settings.js"></script>
    <script src="js/screens/module-placeholder.js"></script>
    <script src="js/screens/idle.js"></script>

    <!-- The world: content → engine → terminal host → CAIN → archive data -->
    <script src="world/input.js?v=2"></script>
    <script src="world/content.js?v=4"></script>
    <script src="world/space.js?v=3"></script>
    <script src="world/renderer.js?v=9"></script>
    <script src="world/dialogue.js?v=3"></script>
    <script src="world/save.js?v=2"></script>
    <script src="world/weather.js?v=3"></script>
    <script src="world/daylight.js?v=2"></script>
    <script src="world/terminal-host.js?v=2"></script>
    <script src="world/engine.js?v=11"></script>
    <script src="world/boot.js?v=2"></script>
</body>
</html>
