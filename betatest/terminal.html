<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAIN | Cadenza Arthouse Information Network</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&family=Pixelify+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/terminal.css?v=5">
    <link id="cain-interface-pack-css" rel="stylesheet" href="">
</head>
<body>
    <!-- STANDALONE CAIN. The same terminal the world opens on an in-game computer
         (index.html) — same screens, same services, same OS class, booted here on
         its own. This page is the kiosk / browser entry; index.html is the game. -->
    <div class="crt-overlay"></div>
    <div class="scanlines"></div>

    <main id="cain-os-display"></main>

    <script src="js/audio.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/config.js"></script>
    <!-- Canonical Archive Record services (ArchiveRecordBuilder/Renderer), reused
         from the game engine so CAIN parses articles the one true way. Root-absolute
         so it resolves at /betatest/ today and at the /terminal/ subdomain later.
         (Moves to /platform/ when that extraction lands.) -->
    <script src="/game/engine/record.js?v=3"></script>
    <script src="js/services/archive.js?v=2"></script>
    <script src="js/services/interface-packs.js"></script>
    <!-- Deployment Configuration (Layer 2): brand, menu, forms, idle playlist,
         QR, links. See "Deployment Configuration Specification.txt". -->
    <script src="js/services/deployment.js"></script>
    <script src="js/focus.js"></script>
    <script src="js/system.js?v=3"></script>
    <!-- Idle Manager (Core Engine): inactivity timing lives here; the media
         it shows comes from the active deployment's kiosk.idlePlaylist. -->
    <script src="js/idle.js"></script>
    <script src="js/screens/boot.js?v=2"></script>
    <script src="js/screens/home.js?v=4"></script>
    <script src="js/screens/archive.js?v=2"></script>
    <script src="js/screens/record.js?v=3"></script>
    <script src="js/screens/settings.js"></script>
    <script src="js/screens/module-placeholder.js"></script>
    <script src="js/screens/idle.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
