<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="robots" content="noindex">
  <title>Cadenza Archive — Terminal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* The standalone shell owns only the boot/background chrome. The terminal
       injects its own full-screen styles (engine/terminal.js #archive-terminal). */
    html, body {
      margin: 0; height: 100%; background: #050403; color: #c8c2b4;
      font-family: 'IBM Plex Mono', monospace; overflow: hidden;
    }
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px; background: #050403; z-index: 10;
      transition: opacity 0.4s ease;
    }
    body.booted #boot { opacity: 0; pointer-events: none; }
    #boot .b-title { color: #A07840; letter-spacing: 3px; font-size: 15px; text-transform: uppercase; }
    #boot .b-status { color: #6f6a60; font-size: 12px; letter-spacing: 1px; }
    #boot::after { /* scanlines, matching the terminal aesthetic */
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.18) 2px 3px);
    }
  </style>

  <!-- PlatformConfig (INTERFACE_CONTRACTS.md §2). archiveRoot '' = same-origin
       root; the apex/subdomain both serve the article archive at root. mode is
       overridable via ?mode=archivist. The shell never hardcodes paths. -->
  <script>
    window.CADENZA_CONFIG = {
      interfaceVersion: 1,
      archiveRoot: '',        // articles resolve at the deployment root
      mode: 'public',         // default; ?mode=archivist unlocks full access
      developer: false
    };
  </script>
</head>
<body>

  <div id="boot">
    <div class="b-title">CADENZA ARCHIVE OS</div>
    <div class="b-status" id="boot-status">INITIALIZING…</div>
  </div>

  <!-- Shared platform library (root-absolute so it works at /terminal/ or a
       subdomain root) -->
  <script src="/platform/events/bus.js?v=16"></script>

  <!-- Archive + Record services + the Terminal UI. NOTE: simulation/engine/
       presentation/audio/touch are deliberately NOT loaded — there is no game
       world here. The standalone host supplies the engine-shaped surface. -->
  <script src="/game/engine/archive.js?v=17"></script>
  <script src="/game/engine/record.js?v=16"></script>
  <script src="/game/engine/terminal.js?v=16"></script>

  <!-- Standalone host: builds the Archive, wraps it, boots the Terminal -->
  <script src="standalone-host.js?v=1"></script>

</body>
</html>
