<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Articles — THE FEED</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="all-page">

  <header>
    <div class="header-inner">
      <div class="header-meta">
        <a href="index.html" class="back-link">← Back to Home</a>
      </div>
      <h1 class="site-title"><a href="index.html">THE FEED</a></h1>
      <nav>
        <a href="index.html">Latest</a>
        <a href="all.html" class="active">All Articles</a>
      </nav>
    </div>
    <div class="header-rule"></div>
  </header>

  <main class="all-main">
    <div class="all-header">
      <div class="section-label">— Archive</div>
      <h2 class="all-title">All Articles</h2>
      <p class="all-subtitle" id="all-subtitle">Loading archive...</p>
    </div>

    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Filter articles..." autocomplete="off">
    </div>

    <div class="article-list" id="article-list">
      <!-- populated by JS -->
      <div class="list-skeleton"></div>
      <div class="list-skeleton"></div>
      <div class="list-skeleton"></div>
      <div class="list-skeleton"></div>
      <div class="list-skeleton"></div>
    </div>
  </main>

  <footer>
    <div class="footer-inner">
      <span class="site-title-small">THE FEED</span>
      <span>Self-hosted. No trackers. Just words.</span>
    </div>
  </footer>

  <script>
    // ============================================================
    const GITHUB_USER = 'fmohod';
    const GITHUB_REPO = 'CadenzaFeed';
    // ============================================================

    const BASE_URL = `https://${GITHUB_USER}.github.io/${GITHUB_REPO}`;
    const API_BASE = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/`;

    let allArticles = [];

    async function getArticleFolders() {
      const res = await fetch(API_BASE);
      if (!res.ok) throw new Error('GitHub API fetch failed');
      const contents = await res.json();
      return contents
        .filter(f => f.type === 'dir' && /^\d{4}$/.test(f.name))
        .sort((a, b) => b.name.localeCompare(a.name));
    }

    async function getArticleMeta(folder) {
      const url = `${BASE_URL}/${folder}/`;
      try {
        const res  = await fetch(url);
        const html = await res.text();
        const doc  = new DOMParser().parseFromString(html, 'text/html');
        const title = doc.querySelector('title')?.textContent?.trim()
          || doc.querySelector('h1')?.textContent?.trim()
          || `Article ${folder}`;
        const desc = doc.querySelector('meta[name="description"]')?.content
          || doc.querySelector('p')?.textContent?.trim().slice(0, 120) + '…'
          || '';
        const date = doc.querySelector('meta[name="date"]')?.content || '';
        return { folder, title, desc, date, url };
      } catch {
        return { folder, title: `Article ${folder}`, desc: '', date: '', url };
      }
    }

    function formatDate(dateStr) {
      if (!dateStr) return `#${allArticles.findIndex(a => a.folder === dateStr)}`;
      try {
        return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US',
          { year: 'numeric', month: 'short', day: 'numeric' });
      } catch { return dateStr; }
    }

    function renderList(articles) {
      const list = document.getElementById('article-list');
      if (articles.length === 0) {
        list.innerHTML = `<div class="no-results">No articles match that search.</div>`;
        return;
      }
      list.innerHTML = articles.map((a, i) => `
        <a href="${a.url}" class="list-item" style="animation-delay:${Math.min(i,20) * 0.04}s">
          <div class="list-num">${String(allArticles.indexOf(a) + 1).padStart(2,'0')}</div>
          <div class="list-body">
            <h3>${a.title}</h3>
            ${a.desc ? `<p>${a.desc}</p>` : ''}
          </div>
          <div class="list-right">
            ${a.date ? `<time>${formatDate(a.date)}</time>` : `<span class="folder-id">${a.folder}</span>`}
            <span class="list-arrow">→</span>
          </div>
        </a>
      `).join('');
    }

    document.getElementById('search-input').addEventListener('input', e => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) { renderList(allArticles); return; }
      renderList(allArticles.filter(a =>
        a.title.toLowerCase().includes(q) || a.desc.toLowerCase().includes(q)
      ));
    });

    async function init() {
      const list = document.getElementById('article-list');
      try {
        const folders = await getArticleFolders();
        document.getElementById('all-subtitle').textContent =
          `${folders.length} article${folders.length !== 1 ? 's' : ''} in the archive`;

        // Fetch all metas (batched to avoid hammering)
        const metas = [];
        for (let i = 0; i < folders.length; i += 5) {
          const batch = folders.slice(i, i + 5);
          const results = await Promise.all(batch.map(f => getArticleMeta(f.name)));
          metas.push(...results);
          allArticles = metas;
          renderList(metas); // render progressively
        }
      } catch (err) {
        list.innerHTML = `<div class="error-state"><p>⚠ Could not load articles. Check your GITHUB_USER and GITHUB_REPO config.</p></div>`;
        console.error(err);
      }
    }

    init();
  </script>
</body>
</html>
